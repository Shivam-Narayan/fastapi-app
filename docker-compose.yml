services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fastapi_db
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    labels:
      logging: "promtail"
      logging_jobname: "backend-core"
      service_name: "backend-core"
      env: "dev"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      logging: "promtail"
      service_name: "backend-core"
      logging_jobname: "backend-core"
      env: "dev"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:9.12
    restart: unless-stopped
    labels:
      logging: "promtail"
      service_name: "backend-core"
      logging_jobname: "backend-core"
      env: "dev"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVERS_JSON: |
        {
          "Servers": {
            "1": {
              "Name": "fastapi_db",
              "Host": "postgres",
              "Port": 5432,
              "Username": "postgres",
              "Password": "postgres",
              "SSLMode": "prefer",
              "MaintenanceDB": "postgres"
            }
          }
        }
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    labels:
      logging: "promtail"
      service_name: "backend-core"
      logging_jobname: "backend-core"
      env: "dev"
    ports:
      - "4000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    labels:
      logging: "promtail"
      service_name: "backend-core"
      logging_jobname: "backend-core"
      env: "dev"
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    labels:
      logging: "promtail"
      service_name: "backend-core"
      logging_jobname: "backend-core"
      env: "dev"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  postgres_data:
  grafana_data:
