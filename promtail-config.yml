server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      # Use Docker label logging_jobname as the Loki job label
      - source_labels: [__meta_docker_container_label_logging_jobname]
        target_label: job
      - source_labels: [job]
        regex: ^$
        target_label: job
        replacement: backend-core
      # Container name → container label
      - source_labels: [__meta_docker_container_name]
        regex: /?(.*)
        target_label: container
      # app service name → service_name label
      - source_labels: [__meta_docker_container_label_service_name]
        target_label: service_name
      - source_labels: [service_name]
        regex: ^$
        target_label: service_name
        replacement: backend-core
      # env label
      - source_labels: [__meta_docker_container_label_env]
        target_label: env
      # Docker image name → image label
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      # Point promtail at the container log file
      - source_labels: [__meta_docker_container_id]
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/$1-json.log
    pipeline_stages:
      # Parse the Docker JSON log wrapper
      - json:
          expressions:
            output: log
            stream: stream
      - labels:
          stream:
      # Try to extract a log level from the message
      - regex:
          expression: '(?i).*"?(?P<level>debug|info|warning|warn|error|critical)"?.*'
          source: output
      - labels:
          level:
      - output:
          source: output
